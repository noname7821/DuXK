name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check files
        run: |
          test -f DuXK.xcodeproj/project.pbxproj
          test -f Info.plist
          test -f DuXKApp.swift
          test -f ContentView.swift
          test -f HomeView.swift
          test -f UpdatesView.swift
          test -f SettingsView.swift
          test -f fallbackNews.json
          test -f duxk-feed.json

      - name: Validate JSON
        run: |
          python3 -c "import json; json.load(open('fallbackNews.json')); json.load(open('duxk-feed.json')); print('JSON ok')"

      - name: Check iOS14 API
        run: |
          ! grep -r "NavigationStack" --include="*.swift" . || (echo "NavigationStack not allowed" && exit 1)
          echo "API check ok"

  ipa:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Archive
        run: |
          xcodebuild -project DuXK.xcodeproj -target DuXK -configuration Release -destination 'generic/platform=iOS' -archivePath build/DuXK.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Pack IPA
        run: |
          mkdir -p Payload
          cp -R build/DuXK.xcarchive/Products/Applications/DuXK.app Payload/
          zip -r DuXK-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DuXK-unsigned
          path: DuXK-unsigned.ipa
