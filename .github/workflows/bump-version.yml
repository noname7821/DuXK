name: bump-version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: "!startsWith(github.event.head_commit.message, 'Bump version')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bump patch version if app code changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -Eq '\.(swift|plist)$|\.pbxproj$|Assets\.xcassets/'; then
            python3 .github/workflows/bump-version.py
          else
            echo "nur Feed/Doku -> kein Bump"
          fi

      - name: Commit and push if changed
        run: |
          if git diff --quiet version.txt Info.plist DuXK.xcodeproj/project.pbxproj; then
            echo "nichts zu bumpen"
          else
            git config user.name "duxk-bot"
            git config user.email "duxk-bot@users.noreply.github.com"
            V=$(cat version.txt)
            git add version.txt Info.plist DuXK.xcodeproj/project.pbxproj
            git commit -m "Bump version to $V"
            git push
          fi
