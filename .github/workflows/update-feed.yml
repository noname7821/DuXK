name: update-feed

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update feed from GitHub releases
        run: python3 update-feed.py

      - name: Validate JSON
        run: |
          python3 -c "import json; f=json.load(open('duxk-feed.json')); g=json.load(open('fallbackNews.json')); assert f==g, 'feed != fallback'; assert len(f['news'])>0 and len(f['firmwares'])>0; print('feed ok:', len(f['news']), 'news /', len(f['firmwares']), 'firmwares')"

      - name: Commit and push if changed
        run: |
          if git diff --quiet duxk-feed.json fallbackNews.json; then
            echo "keine Aenderung"
          else
            git config user.name "duxk-bot"
            git config user.email "duxk-bot@users.noreply.github.com"
            git add duxk-feed.json fallbackNews.json
            git commit -m "Auto-update feed (etaHEN/PPPwn releases)"
            git push
          fi
